/**:
  ros__parameters:
    gcopter:
      MapTopic: "/grid_map"
      TargetTopic: "/goal_pose"
      OdomTopic: "/Odometry_to_base_link"

      # true 使用八邻接搜索，false 使用四邻接搜索。
      is_omni: true

      # false 时，前两条 /goal_pose 依次作为起点和终点，之后按轨迹时间推进内部位置。
      # true 时，每条 /goal_pose 都是终点，规划起点取最近一帧 map 坐标 odom。
      is_plan_from_ego_pose: false

      # false 模式离线运行时发布轨迹 odom；接入真实 odom 时设置为 false。
      PublishTrajectoryOdom: true

      # 基线时间分配使用的标称速度，单位 m/s。连续轨迹速度约束由后端实现。
      MaxVelMag: 0.5
